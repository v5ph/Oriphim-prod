[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oriphim"
version = "0.1.0"
description = "oriphim turns a described physical system into a computational experiment, and produces the evidence needed to judge whether its results can be believed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
oriphim = "oriphim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oriphim = ["assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
